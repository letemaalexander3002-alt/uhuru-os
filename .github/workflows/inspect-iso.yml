name: Inspect Uhuru OS ISO

# Hupakua ISO ya run ya "Build Uhuru OS ISO" KWENYE seva za GitHub, inaikagua, inaiwasha kwenye QEMU
# na kupiga picha za skrini. Matokeo ni artifact ndogo "uhuru-os-report" (KB chache).
# Kuiendesha kwa mkono:  gh workflow run inspect-iso.yml -f run_id=<ID ya run ya build>
# Kuzuia ukaguzi wa kiotomatiki baada ya kila build (kuokoa dakika za Actions): futa kipengele cha workflow_run.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "ID ya run ya 'Build Uhuru OS ISO' yenye artifact uhuru-os-iso"
        required: true
  workflow_run:
    workflows: ["Build Uhuru OS ISO"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
    steps:
      - uses: actions/checkout@v4

      - name: Pakua ISO artifact kutoka run ${{ env.RUN_ID }}
        uses: actions/download-artifact@v4
        with:
          name: uhuru-os-iso
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: iso

      - name: Weka zana
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xorriso squashfs-tools qemu-system-x86 socat imagemagick

      - name: Ripoti ya ukaguzi wa ISO
        run: bash scripts/inspect-iso.sh "$(ls iso/*.iso | head -1)" out

      - name: Wezesha KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Washa ISO na piga picha za skrini
        run: bash scripts/boot-screens.sh "$(ls iso/*.iso | head -1)" out/screens

      - name: Matokeo ya login kutoka mwanzo hadi mwisho (e2e)
        run: bash scripts/e2e-verdict.sh out/screens/serial.log | tee -a out/report.txt

      - name: Pakia ripoti na picha
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uhuru-os-report
          path: out
          if-no-files-found: warn
